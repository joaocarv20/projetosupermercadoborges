<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar – Compras Inteligentes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-login">
  <form class="caixa-login" method="post">
    <h1>Compras Inteligentes</h1>
    <p class="subtitulo">Supermercado Borger</p>

    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" autocomplete="username" required autofocus>

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>

    <button type="submit" class="botao principal">Entrar</button>
    <p class="nota">Protótipo: qualquer usuário e senha entram.</p>
  </form>
</body>
</html>
